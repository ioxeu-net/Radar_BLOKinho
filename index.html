<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miniloja Relâmpago - Conteúdo & Ofertas</title>
  <style>
    *,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb;--tw-translate-x:0;--tw-translate-y:0;--tw-scale-x:1;--tw-scale-y:1}
    body{background-color:#09090b;color:#f4f4f5;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;padding:16px;min-height:100vh}
    .container{width:100%;max-width:480px;margin-left:auto;margin-right:auto}
    .status-badge{display:inline-block;font-size:10px;font-weight:bold;letter-spacing:2px;color:#10b981;background:rgba(16,185,129,.1);padding:4px 10px;border-radius:20px;margin-bottom:8px}
    
    /* Menu de Categorias Dinâmicas */
    .menu-filtros{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
    .filtro-btn{flex:1;min-width:90px;background-color:#141417;color:#71717a;border:1px solid rgba(255,255,255,.05);padding:10px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:11px;text-align:center;transition:all .2s}
    .filtro-btn.active{background-color:#27272a;color:#4ade80;border-color:#4ade80}
    
    /* Blocos de Dicas e Conteúdo */
    .card-dica{background:linear-gradient(135deg, #1e1b4b 0%, #09090b 100%);border:1px solid rgba(124,58,237,0.2);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.3)}
    
    /* Cards de Produto Estilo Premium */
    .product-card{background:#141417;border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:16px;margin-bottom:12px;transition:transform 0.2s}
    .badge-off{background:rgba(16,185,129,.1);color:#10b981;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px}
    .btn-zap{width:100%;background-color:#10b981;color:white;border:none;padding:12px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-transform:uppercase}
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Cabeçalho Principal -->
    <header style="text-align: center; margin-bottom: 15px;">
      <span class="status-badge">● CONTEÚDO DIÁRIO • VITRINE AO VIVO</span>
      <h1 style="font-size: 22px; font-weight: 900; color: #4ade80;" id="lblNomeLoja">MINILOJA RELÂMPAGO</h1>
    </header>

    <!-- Espaço de Navegação das Categorias Dinâmicas -->
    <nav class="menu-filtros">
      <button class="filtro-btn active" id="f-todos" onclick="filtrarCategoria('todos')">🌐 Tudo</button>
      <button class="filtro-btn" id="f-casa" onclick="filtrarCategoria('casa')">🏠 Dicas Casa</button>
      <button class="filtro-btn" id="f-bolos" onclick="filtrarCategoria('bolos')">🍰 Bolos</button>
      <button class="filtro-btn" id="f-comidas" onclick="filtrarCategoria('comidas')">🍲 Comidas</button>
      <button class="filtro-btn" id="f-molhos" onclick="filtrarCategoria('molhos')"> Tomato Molhos</button>
    </nav>

    <!-- Bloco Dinâmico de Dicas (Muda de acordo com o clique no menu) -->
    <div class="card-dica" id="painel-dica-diaria">
      <h4 style="color:#c084fc; font-size:13px; font-weight:800; display:flex; align-items:center; gap:6px;" id="dica-titulo">💡 DICA DO DIA</h4>
      <p style="font-size:11px; color:#f4f4f5; margin-top:6px; opacity:0.85; line-height:1.5;" id="dica-texto">
        Seja bem-vindo! Navegue pelos nossos espaços para conferir receitas exclusivas, truques de organização para o lar e os melhores achados promocionais para a sua cozinha!
      </p>
    </div>

    <!-- Container onde entrarão os Anúncios e Conteúdos -->
    <main id="vitrine-dinamica">
      <!-- Injetado de forma inteligente via script.js -->
    </main>

    <footer style="text-align: center; font-size: 9px; letter-spacing: 2px; color: #71717a; margin-top: 32px; text-transform: uppercase;">
      FÁBRICA CENTRAL BLOKINHO • CONTEÚDO DINÂMICO
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
